<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Raid Legend Gradient Background -->
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="p2-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Mega Crystal Pink Glow -->
    <radialGradient id="p2-crystal" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>

    <filter id="p2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="p2-gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#p2-bg)" filter="url(#p2-shadow)" />

  <!-- Outer Gold Trophy Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#p2-gold)" stroke-width="6" opacity="0.6" stroke-dasharray="16 10" />

  <!-- Outer Shield Crest Outline -->
  <circle cx="256" cy="256" r="145" fill="#0F172A" stroke="url(#p2-gold)" stroke-width="12" filter="url(#p2-gold-glow)" />

  <!-- Pokeball Red Upper Sphere inside Shield -->
  <path d="M 118,256 A 138,138 0 0,1 394,256 Z" fill="#DC2626" />
  <!-- Pokeball White Lower Sphere inside Shield -->
  <path d="M 118,256 A 138,138 0 0,0 394,256 Z" fill="#F8FAFC" opacity="0.95" />

  <!-- Dark Center Band -->
  <rect x="118" y="246" width="276" height="20" fill="#0F172A" />

  <!-- Mega Crystal Diamond Button in Center -->
  <circle cx="256" cy="256" r="52" fill="url(#p2-gold)" />
  <circle cx="256" cy="256" r="40" fill="url(#p2-crystal)" />

  <!-- Diamond Star Sparkle in Center -->
  <polygon points="256,224 263,249 288,256 263,263 256,288 249,263 224,256 249,249" fill="#FFFFFF" opacity="0.9" />

  <!-- Crossed Raid Swords Icon Overlay -->
  <path d="M 80,80 L 140,140 M 140,80 L 80,140" stroke="#FFCC01" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <path d="M 432,80 L 372,140 M 372,80 L 432,140" stroke="#FFCC01" stroke-width="8" stroke-linecap="round" opacity="0.8" />
</svg>
